<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的浏览器插件</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; padding:26px 16px 60px; background:#0f1115; color:#e6e9ef;
    font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:620px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#8b93a1; font-size:13px; margin-bottom:22px; }
  .card { background:#171a20; border:1px solid #232833; border-radius:14px; padding:16px 16px 14px; margin-bottom:12px; }
  .row { display:flex; align-items:center; gap:10px; margin-bottom:2px; }
  .ic { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:19px; flex:none; }
  .t { font-weight:600; font-size:15px; }
  .d { color:#8b93a1; font-size:12.5px; margin-top:2px; }
  .ver { font-size:11px; padding:2px 8px; border-radius:20px; background:#1d3a5f; color:#7fbcf5; }
  a.btn { display:block; text-align:center; text-decoration:none; background:#2f6fd0; color:#fff;
    font-weight:600; font-size:14px; padding:11px; border-radius:10px; margin-top:12px; }
  a.btn.ghost { background:#20242c; color:#9fb6d4; font-weight:400; font-size:12.5px; padding:9px; }
  a.btn:active { opacity:.85; }
  .tip { color:#77808e; font-size:12px; margin-top:14px; line-height:1.7; }
  code { background:#0b0d11; padding:1px 5px; border-radius:5px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>我的浏览器插件</h1>
  <div class="sub">点「安装」直接用 · 更新走脚本内置的更新地址</div>

  <div class="card">
    <div class="row">
      <div class="ic" style="background:#3a1d1d">🛡</div>
      <div style="flex:1">
        <div class="t">广告拦截 <span class="ver" data-ver="adblock.user.js">v—</span></div>
        <div class="d">拦广告/追踪请求 · 隐藏广告位 · 跳过 YouTube 广告</div>
      </div>
    </div>
    <a class="btn" href="adblock.user.js">安装 / 更新</a>
  </div>

  <div class="card">
    <div class="row">
      <div class="ic" style="background:#152b45">🎬</div>
      <div style="flex:1">
        <div class="t">视频提取器 <span class="ver" data-ver="https://orange123eee.github.io/xb-video-kit/video-extractor.user.js">v—</span></div>
        <div class="d">接管网页播放器 · 手势拖动 · 多线程下载合并 MP4</div>
      </div>
    </div>
    <a class="btn" href="https://orange123eee.github.io/xb-video-kit/video-extractor.user.js">安装 / 更新</a>
  </div>

  <div class="tip">
    安装方式：复制按钮对应的地址，在 X浏览器 里
    <code>菜单 → 脚本 → 从网址安装</code> 粘贴即可。<br>
    更新：脚本里写了 <code>@updateURL</code>，在脚本管理里点「检查更新」就能拿到新版。
  </div>
</div>
<script>
  // 版本号直接从脚本文件里读，避免页面和脚本对不上
  document.querySelectorAll('[data-ver]').forEach(function (el) {
    var url = el.getAttribute('data-ver');
    fetch(url, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var m = t.match(/@version\s+([\w.\-]+)/);
        if (m) el.textContent = 'v' + m[1];
      })
      .catch(function () {});
  });
</script>
</body>
</html>
